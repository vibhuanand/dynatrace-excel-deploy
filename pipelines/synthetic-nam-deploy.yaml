# pipelines/synthetic-nam-deploy.yaml
trigger: none
pr: none

parameters:
- name: mission_space
  type: string
  default: cra
  values: [cra, statscan]

- name: environment
  type: string
  default: prod
  values: [dev, prod]

- name: run_mode
  type: string
  default: plan
  values: [plan, dry-run, apply]

variables:
  PLAYBOOK: ansible/site.yaml

stages:
# === Build (render NAM from SSOT; no Dynatrace calls) ===
- stage: BuildNAM
  displayName: 'Render NAM payloads (offline)'
  jobs:
  - job: Compose
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      clean: true
      lfs: true
      submodules: recursive

    - task: UsePythonVersion@0
      inputs: { versionSpec: '3.x' }

    - task: Bash@3
      displayName: 'Install Ansible + yq + openpyxl'
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "ansible==9.*" pyyaml openpyxl
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

    # Render manifest that includes ONLY synthetic-nam project (inline var "projects")
    - task: Bash@3
      displayName: 'Render manifest (NAM-only) + build payloads'
      env:
        ANSIBLE_FORCE_COLOR: '1'
        ANSIBLE_HOST_KEY_CHECKING: 'False'
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          ENV_FILE="envs/${{ parameters.mission_space }}/${{ parameters.environment }}.yaml"

          # 1) Render manifest (your site.yaml should already read cfg & projects)
          ansible-playbook -i localhost, -c local "$(PLAYBOOK)" \
            -e "ssot_file=${ENV_FILE}" \
            -e "env_file=${ENV_FILE}" \
            -e "lookup_hosts=false" \
            -e "mission_space=${{ parameters.mission_space }}" \
            -e "environment_name=${{ parameters.environment }}" \
            -e "run_mode=${{ parameters.run_mode }}" \
            -e '{ "projects": [ { "name": "synthetic-nam", "path": "ansible/modules/synthetic-nam" } ] }'

          # 2) Build NAM payloads from SSOT (inline Python; no extra file needed)
          python3 - << 'PY'
          import os, sys, json, yaml, re
          from pathlib import Path

          ssot = Path("envs")/ "${{ parameters.mission_space }}" / ("${{ parameters.environment }}.yaml")
          if not ssot.is_file():
              print(f"ERROR: SSOT not found: {ssot}", file=sys.stderr); sys.exit(2)
          cfg = yaml.safe_load(ssot.read_text(encoding="utf-8")) or {}
          res = ((cfg.get("resources") or {}).get("network_availability") or {})
          defaults = res.get("defaults") or {}
          sources  = res.get("sources") or []
          base_locs = defaults.get("locations") or []
          base_freq = int(defaults.get("frequency_min") or 5)
          icmp_def  = defaults.get("icmp") or {}
          cons_def  = defaults.get("constraints") or {}
          outage    = defaults.get("outage_handling") or {}

          def split_csv(s):
              return [p.strip() for p in str(s).split(",") if p and str(p).strip()]

          items = []
          for s in sources:
              path = s["path"] if isinstance(s, dict) else s
              p = (ssot.parent / path) if not os.path.isabs(path) else Path(path)
              if not p.is_file():
                  print(f"WARNING: missing source {p}", file=sys.stderr); continue
              if p.suffix.lower() == ".json":
                  rows = json.loads(p.read_text(encoding="utf-8"))
              else:
                  print(f"WARNING: unsupported source (use .json). Skipping {p}", file=sys.stderr); continue
              for r in rows:
                  itm = {
                      "name": r.get("name"),
                      "enabled": bool(r.get("enabled", True)),
                      "frequencyMin": int(r.get("frequency_min") or base_freq),
                      "locations": r.get("locations") or base_locs,
                      "icmp": {
                          "packets": int(((r.get("icmp") or {}).get("packets", icmp_def.get("packets", 5)))),
                          "timeout": (r.get("icmp") or {}).get("timeout", icmp_def.get("timeout", "PT1S")),
                          "ip_version": str((r.get("icmp") or {}).get("ip_version", icmp_def.get("ip_version", "4")))
                      },
                      "constraints": {
                          "step_success_rate": (r.get("constraints", {}) or {}).get("step_success_rate", cons_def.get("step_success_rate", {"operator":">=","value":"95"})),
                          "per_target_success": (r.get("constraints", {}) or {}).get("per_target_success", cons_def.get("per_target_success", {"operator":"=","value":"100"})),
                      },
                      "outage_handling": outage,
                      "targets": r.get("targets") or []
                  }
                  if itm["name"] and itm["targets"]:
                      items.append(itm)

          out_root = Path(".generated/ansible/modules/synthetic-nam")
          (out_root/"payloads").mkdir(parents=True, exist_ok=True)

          # config.yaml driving deploy
          cfg_yaml = ["configs:"]
          for m in items:
              safe_id = re.sub(r"[^A-Za-z0-9_.:-]", "_", m["name"])
              cfg_yaml.append(f"  - id: {safe_id}")
              cfg_yaml.append(f"    name: {m['name']}")
              cfg_yaml.append(f"    enabled: {'true' if m['enabled'] else 'false'}")
              cfg_yaml.append(f"    frequencyMin: {m['frequencyMin']}")
              cfg_yaml.append(f"    locations: {m['locations']}")
              cfg_yaml.append(f"    icmp:")
              cfg_yaml.append(f"      packets: {m['icmp']['packets']}")
              cfg_yaml.append(f"      timeout: \"{m['icmp']['timeout']}\"")
              cfg_yaml.append(f"      ip_version: \"{m['icmp']['ip_version']}\"")
              cfg_yaml.append(f"    constraints:")
              ss = m['constraints']['step_success_rate']; ps = m['constraints']['per_target_success']
              cfg_yaml.append(f"      step_success_rate: {{ operator: \"{ss['operator']}\", value: \"{ss['value']}\" }}")
              cfg_yaml.append(f"      per_target_success: {{ operator: \"{ps['operator']}\", value: \"{ps['value']}\" }}")
              cfg_yaml.append(f"    targets: {m['targets']}")
              # write payload json
              payload = {
                  "name": m["name"],
                  "type": "MULTI_PROTOCOL",
                  "enabled": m["enabled"],
                  "frequencyMin": m["frequencyMin"],
                  "locations": m["locations"],
                  "steps": [{
                      "name": "ICMP",
                      "requestType": "ICMP",
                      "constraints": [
                          {"type": "SUCCESS_RATE_PERCENT", "properties": {"operator": ss["operator"], "value": ss["value"]}}
                      ],
                      "properties": {
                          "ICMP_NUMBER_OF_PACKETS": m["icmp"]["packets"],
                          "ICMP_TIMEOUT_FOR_REPLY": m["icmp"]["timeout"],
                          "ICMP_IP_VERSION": m["icmp"]["ip_version"]
                      },
                      "targetList": m["targets"],
                      "requestConfigurations": [
                          {"constraints": [{"type": "ICMP_SUCCESS_RATE_PERCENT", "properties": {"operator": ps["operator"], "value": ps["value"]}}]}
                      ]
                  }],
                  "syntheticMonitorOutageHandlingSettings": {
                      "globalOutages": bool(outage.get("globalOutages", True)),
                      "localOutages": bool(outage.get("localOutages", True)),
                      "globalConsecutiveOutageCountThreshold": int(outage.get("globalConsecutiveOutageCountThreshold", 1)),
                      "localConsecutiveOutageCountThreshold": int(outage.get("localConsecutiveOutageCountThreshold", 3))
                  }
              }
              (out_root/"payloads"/f"{safe_id}.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")

          (out_root/"config.yaml").write_text("\n".join(cfg_yaml)+"\n", encoding="utf-8")
          print(f"Wrote NAM config + payloads to {out_root}")
          PY

    - task: PublishPipelineArtifact@1
      displayName: 'Publish generated NAM'
      inputs:
        targetPath: '.generated'
        artifact: 'generated'
        publishLocation: 'pipeline'

# === Deploy ===
- stage: DeployNAM
  displayName: 'Deploy Synthetic NAM to Dynatrace'
  dependsOn: BuildNAM
  condition: ne('${{ parameters.run_mode }}','plan')
  jobs:
  - job: Deploy
    pool:
      name: 'vibhu_machine'      # your self-hosted agent
      demands:
      - dynatrace-reach -equals yes
    steps:
    - checkout: self
      clean: true
      lfs: true

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: current
        artifact: generated
        targetPath: '$(Pipeline.Workspace)/generated'

    - task: PowerShell@2
      displayName: 'Deploy NAM (create/update ICMP monitors)'
      env:
        DT_TOKEN_CRA_PROD: $(DT_TOKEN_CRA_PROD)
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          $gen = Join-Path $env:PIPELINE_WORKSPACE 'generated'
          $manifest = Join-Path $gen 'manifest.yaml'
          if (!(Test-Path $manifest)) { throw "manifest.yaml missing" }
          $m = Get-Content $manifest -Raw

          $envName = '${{ parameters.environment }}'
          $pat = "(?ms)-\s*name:\s*""?$envName""?.*?\burl:\s*(?:\r?\n\s*type:\S+\s*)?\r?\n\s*value:\s*""?([^\r\n#""\s]+)"
          $baseUrl = [regex]::Match($m, $pat).Groups[1].Value.Trim('"')
          if (-not $baseUrl) { throw "Base URL for '$envName' not found in manifest." }

          $tok = $env:DT_TOKEN_CRA_PROD
          if ([string]::IsNullOrWhiteSpace($tok)) { throw "DT_TOKEN_CRA_PROD is empty" }

          $projDir = Join-Path $gen 'ansible\modules\synthetic-nam'
          $cfg = Join-Path $projDir 'config.yaml'
          $pdir = Join-Path $projDir 'payloads'
          if (!(Test-Path $cfg))  { throw "NAM config not found: $cfg" }
          if (!(Test-Path $pdir)) { throw "NAM payloads not found: $pdir" }

          python --version
          python -m pip install --upgrade pip pyyaml

          $mode = if ('${{ parameters.run_mode }}' -eq 'apply') { 'apply' } else { 'dry-run' }
          $scriptPath = Join-Path '$(Build.SourcesDirectory)' 'pipelines\scripts\deploy_synthetic_nam.py'

          & python $scriptPath `
            --base-url "$baseUrl" `
            --token "$tok" `
            --config "$cfg" `
            --payload-dir "$pdir" `
            --mode $mode

          if ($LASTEXITCODE -ne 0) { throw "NAM deploy exited with $LASTEXITCODE" }
